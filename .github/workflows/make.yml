name: build and test

on: push

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v7
    - name: Platform
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.3/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: make
      run: make 
    - name: test
      run: |
        nix develop --command bash -c 'timeout 15s qemu-system-x86_64 -hda test_disk.qcow2 -nographic -serial file:test.log || true'
        cat test.log
